name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, intl, pdo_pgsql, zip, gd
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: Lint
        run: find src tests demo/project/modules demo/docker -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - run: vendor/bin/phpunit

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: bcmath, intl, pdo_pgsql, zip, gd
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G --error-format=github
      - name: TEMP baseline dump
        if: failure()
        run: |
          vendor/bin/phpstan analyse --no-progress --memory-limit=1G --generate-baseline /tmp/b.neon --allow-empty-baseline || true
          echo "::notice title=baseline::$(sed -e 's/%/%25/g' /tmp/b.neon | awk '{printf "%s%%0A", $0}')"

  demo:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Build the demo image
        run: docker build -f demo/Dockerfile -t supertext-craft-demo .
      - name: Start the stand-in API
        run: node tests/docs/stand-in.mjs > stand-in.log 2>&1 &
      - name: Start the demo twice, check the accounts, translate the sample article
        env:
          PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: tests/demo-check.sh
      - if: failure()
        run: docker logs demo 2>&1 | tail -100; cat stand-in.log
